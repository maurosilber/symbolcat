[project]
name = "symbolcat"
version = "0.0.1"
description = "A minimalistic symbolic package."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Dyscolab" }]
keywords = ["symbolic"]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
changelog = "https://github.com/dyscolab/symbolcat/blob/main/CHANGES"
homepage = "https://github.com/dyscolab/symbolcat"
issues = "https://github.com/dyscolab/symbolcat/issues"

[project.optional-dependencies]
egraph = ["egglog"]

[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"

# for zuban: egglog terms are declared with docstring or `...` bodies
[[tool.mypy.overrides]]
module = ["symbolcat.ops.egraph._term"]
disable_error_code = ["empty-body"]

[tool.pyrefly]
# explicit, so pyrefly does not migrate the [tool.mypy] settings meant for zuban
project-includes = ["src", "tests", "conftest.py"]

[[tool.pyrefly.sub-config]]
matches = "src/symbolcat/ops/egraph/_term.py"
errors = { bad-return = false }

[tool.pytest.ini_options]
addopts = "--doctest-glob=README.md"
testpaths = ["src", "tests", "README.md"]

[tool.ruff.format]
docstring-code-format = true

[tool.tombi]
toml-version = "v1.1.0"

[tool.ty.environment]
# pixi's environment is a conda prefix, which ty does not detect from VIRTUAL_ENV
python = ".pixi/envs/default"

# egglog terms are declared with docstring or `...` bodies
[[tool.ty.overrides]]
include = ["src/symbolcat/ops/egraph/_term.py"]
rules = { empty-body = "ignore" }

# each "type: ignore" there marks an expected static error
[[tool.ty.overrides]]
include = ["tests/test_static_types.py"]
rules = { unused-type-ignore-comment = "error" }
